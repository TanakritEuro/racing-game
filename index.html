<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Racing</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="timing">
        <div id="track-name"></div>
      </div>
      <div id="dash">
        <div id="speed">0</div>
        <div id="unit">KM/H</div>
        <div id="gear">1</div>
        <div id="rpm"><div id="rpm-fill"></div></div>
        <div id="lights"><span id="abs-light">ABS</span><span id="tc-light">TC</span><span id="assist-light">ASSIST</span></div>
      </div>
      <div id="keys">W/S throttle · brake &nbsp; A/D steer &nbsp; Space handbrake &nbsp; E/Q shift &nbsp; M auto/manual &nbsp; Z ABS &nbsp; X TC &nbsp; V assist &nbsp; C camera &nbsp; N next track &nbsp; G ghost &nbsp; ⌫ restart &nbsp; R reset &nbsp; T telemetry</div>
    </div>
    <div id="loading">Loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
